server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # مسح رأس X-Forwarded-Proto القادم من العميل لمنع التزييف قبل إعادة تعيينه بأمان
    proxy_set_header X-Forwarded-Proto "";

    # المجلدات الساكنة والوسائط (Static & Media)
    location /static/ {
        alias /var/www/myproject/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /var/www/myproject/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # التوجيه إلى Gunicorn عبر Unix Socket
    location / {
        proxy_pass http://unix:/var/www/myproject/gunicorn.sock;
        
        # إعدادات الـ Headers الهامة لـ Django
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # إعدادات المهلة وحجم الملفات المرفوعة
        client_max_body_size 20M;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}