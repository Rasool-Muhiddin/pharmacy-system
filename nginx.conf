# /etc/nginx/sites-available/tera-software1.com
#
# قبل استخدام هذا الملف، يجب توليد Cloudflare Origin Certificate:
#   1. لوحة Cloudflare → دومينك → SSL/TLS → Origin Server → Create Certificate
#   2. اختر "Let Cloudflare generate a private key and a CSR"
#   3. أضف الدومينين: tera-software1.com و *.tera-software1.com
#   4. انسخ الشهادة (Certificate) إلى: /etc/ssl/cloudflare/cert.pem
#   5. انسخ المفتاح الخاص (Private Key) إلى: /etc/ssl/cloudflare/key.pem
#   6. تأكد من صلاحيات الملفين:
#        sudo chmod 600 /etc/ssl/cloudflare/key.pem
#        sudo chmod 644 /etc/ssl/cloudflare/cert.pem
#   7. في لوحة Cloudflare → SSL/TLS → Overview → اختر "Full (strict)"

# --- إعادة توجيه HTTP إلى HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name tera-software1.com www.tera-software1.com;

    # مسموح فقط لطلبات فحص Certbot/ACME لو احتجتها لاحقًا لأغراض أخرى
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- الخادم الرئيسي HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tera-software1.com www.tera-software1.com;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # المجلدات الساكنة والوسائط (Static & Media)
    location /static/ {
        alias /var/www/pharmacy/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /var/www/pharmacy/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # التوجيه إلى Gunicorn عبر Unix Socket
    location / {
        proxy_pass http://unix:/var/www/pharmacy/gunicorn.sock;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # الاتصال هنا فعليًا HTTPS (Cloudflare Full-strict)، فـ $scheme صحيح دائمًا
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# --- رفض الطلبات التي تصل عبر IP مباشرة (بدون اسم نطاق مطابق) ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}