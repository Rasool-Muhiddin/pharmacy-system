<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل أسعار الدواء</title>
    <style>
        html {overflow-y: scroll; /* يجبر شريط التمرير على الظهور دائماً (حتى لو كان فارغاً) للحفاظ على أبعاد الشاشة ثابتة */}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 40px; display: flex; justify-content: center; }
        .edit-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-top: 4px solid #f39c12; width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #2c3e50; }
        input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-save { background: #f39c12; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-cancel { display: block; text-align: center; color: #7f8c8d; margin-top: 15px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="edit-box">
        <h2>✏️ تعديل أسعار الدواء</h2>
        <p>الدواء: <strong>{{ medicine.trade_name }}</strong> ({{ medicine.scientific_name }})</p>
        <hr>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>سعر الشراء الحالي (د.ع):</label>
                <input type="number" name="buy_price" value="{{ medicine.buy_price }}" required>
            </div>
            <div class="form-group">
                <label>سعر البيع للمستهلك الحالي (د.ع):</label>
                <input type="number" name="sell_price" value="{{ medicine.sell_price }}" required>
            </div>
            <button type="submit" class="btn-save">💾 حفظ الأسعار الجديدة</button>
            <a href="/pharmacy/inventory/" class="btn-cancel">إلغاء والتراجع</a>
        </form>
    </div>
</body>
</html>
